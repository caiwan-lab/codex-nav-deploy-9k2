<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Codex 安装导航</title>
    <style>
      :root {
        --ink: #27313a;
        --muted: #65717b;
        --paper: #f4f6f2;
        --panel: #fbfcfa;
        --line: #cfd8d0;
        --mint: #0e8a67;
        --mint-deep: #06664c;
        --mint-soft: #e0f3ea;
        --coral: #e96b78;
        --shadow: 0 18px 46px rgb(25 45 37 / 12%);
      }

      * { box-sizing: border-box; }

      html { min-width: 320px; background: var(--paper); }

      body {
        min-height: 100dvh;
        margin: 0;
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        background:
          radial-gradient(circle at 84% 10%, rgb(219 243 230 / 72%), transparent 23rem),
          linear-gradient(135deg, #f8faf7 0%, var(--paper) 58%, #eef3ed 100%);
      }

      button, input { font: inherit; }

      .shell {
        width: min(1120px, calc(100% - 48px));
        min-height: 100dvh;
        margin: 0 auto;
        padding: 28px 0 44px;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 50px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: .02em;
      }

      .brand { display: inline-flex; align-items: center; gap: 10px; }

      .brand-mark {
        width: 22px;
        height: 22px;
        border: 2px solid var(--ink);
        border-radius: 7px;
        background: linear-gradient(135deg, #ffffff 44%, var(--mint-soft) 44%);
      }

      .access-note {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .access-note::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--mint);
      }

      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1.07fr) minmax(330px, .93fr);
        align-items: center;
        gap: clamp(30px, 7vw, 92px);
        padding: clamp(52px, 9vh, 108px) clamp(4px, 3vw, 40px) 34px;
      }

      .intro { max-width: 560px; }

      .intro h1 {
        max-width: 11ch;
        margin: 0;
        font-size: clamp(42px, 5vw, 68px);
        line-height: 1.12;
        letter-spacing: -.055em;
        font-weight: 760;
      }

      .intro p {
        max-width: 31em;
        margin: 22px 0 0;
        color: var(--muted);
        font-size: clamp(17px, 1.8vw, 20px);
        line-height: 1.7;
      }

      .entry-card {
        position: relative;
        overflow: hidden;
        padding: clamp(26px, 3.6vw, 42px);
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgb(251 252 250 / 90%);
        box-shadow: var(--shadow);
      }

      .entry-card::after {
        content: "";
        position: absolute;
        width: 190px;
        height: 190px;
        right: -98px;
        bottom: -108px;
        border: 1px solid rgb(14 138 103 / 20%);
        border-radius: 50%;
        pointer-events: none;
      }

      .route-label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 24px;
        color: var(--mint-deep);
        font-size: 16px;
        font-weight: 700;
      }

      .route-label span {
        display: inline-grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 50%;
        background: var(--mint);
        color: #fff;
        font-size: 14px;
      }

      .entry-card h2 {
        margin: 0;
        font-size: clamp(28px, 3vw, 38px);
        line-height: 1.22;
        letter-spacing: -.035em;
      }

      .entry-card > p {
        margin: 12px 0 30px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.65;
      }

      .field { display: grid; gap: 10px; }

      label {
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
      }

      input {
        width: 100%;
        height: 56px;
        padding: 0 16px;
        border: 1px solid #b9c8be;
        border-radius: 10px;
        color: var(--ink);
        background: #fff;
        outline: none;
        transition: border-color .18s ease, box-shadow .18s ease;
      }

      input::placeholder { color: #9ca8a1; }
      input:focus { border-color: var(--mint); box-shadow: 0 0 0 4px rgb(14 138 103 / 13%); }
      input[aria-invalid="true"] { border-color: var(--coral); box-shadow: 0 0 0 4px rgb(233 107 120 / 12%); }

      .feedback {
        min-height: 22px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .feedback.error { color: #b54250; }
      .feedback.success { color: var(--mint-deep); }

      .enter {
        width: 100%;
        min-height: 58px;
        margin-top: 20px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: var(--mint);
        font-size: 17px;
        font-weight: 750;
        cursor: pointer;
        box-shadow: 0 10px 20px rgb(14 138 103 / 22%);
        transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      }

      .enter:hover { background: var(--mint-deep); box-shadow: 0 13px 24px rgb(14 138 103 / 27%); }
      .enter:active { transform: translateY(1px) scale(.99); }
      .enter:focus-visible { outline: 3px solid rgb(14 138 103 / 28%); outline-offset: 3px; }

      .route-preview {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 30px;
        padding-top: 24px;
        border-top: 1px solid #dce5de;
      }

      .route-preview div { min-width: 0; }
      .route-preview strong { display: block; color: var(--mint-deep); font-size: 14px; }
      .route-preview span { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.45; }

      .demo-result {
        display: none;
        margin-top: 18px;
        padding: 14px 15px;
        border-radius: 10px;
        color: var(--mint-deep);
        background: var(--mint-soft);
        font-size: 14px;
        line-height: 1.55;
      }

      .demo-result.show { display: block; animation: reveal .28s ease-out both; }

      @keyframes reveal {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      }

      @media (max-width: 760px) {
        .shell { width: min(100% - 32px, 560px); padding-top: 16px; }
        .topbar { font-size: 13px; }
        .access-note { font-size: 0; }
        .access-note::before { width: 10px; height: 10px; }
        .stage { grid-template-columns: 1fr; gap: 34px; padding: 58px 0 28px; }
        .intro h1 { max-width: 10ch; font-size: clamp(40px, 12vw, 56px); }
        .entry-card { padding: 27px 22px; border-radius: 18px; }
      }
    </style>
  </head>
  <body>
    <!-- Direction contract: Operate mode. One clear entry action for a paid learner, using calm paper-like surfaces and a single mint action color. Finish: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md. -->
    <main class="shell">
      <header class="topbar" aria-label="页面标题">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Codex 零基础答疑营</span></div>
        <span class="access-note">本期学员入口</span>
      </header>

      <section class="stage" aria-labelledby="page-title">
        <div class="intro">
          <h1 id="page-title">从你卡住的地方开始。</h1>
          <p>不用先看完所有说明。输入邀请码后，页面会带你找到现在最需要解决的那一步。</p>
        </div>

        <section class="entry-card" aria-labelledby="entry-title">
          <p class="route-label"><span aria-hidden="true">1</span>先进入你的导航</p>
          <h2 id="entry-title">输入邀请码</h2>
          <p>邀请码将在正式交付时由老师单独发送。</p>

          <form id="entry-form" novalidate>
            <div class="field">
              <label for="invite-code">你的邀请码</label>
              <input id="invite-code" name="invite-code" type="text" autocomplete="off" placeholder="请输入老师发给你的邀请码" aria-describedby="entry-feedback" />
            </div>
            <p class="feedback" id="entry-feedback" aria-live="polite">请输入邀请码后继续。</p>
            <button class="enter" type="submit">进入安装导航</button>
          </form>

          <div class="route-preview" aria-label="使用方式">
            <div><strong>选卡点</strong><span>先说你现在遇到的问题</span></div>
            <div><strong>看一步</strong><span>只看当前需要的录屏</span></div>
            <div><strong>继续走</strong><span>解决后进入下一步</span></div>
          </div>
        </section>
      </section>
    </main>

    <script src="./gate.js"></script>
    <script>
      const form = document.getElementById('entry-form');
      const input = document.getElementById('invite-code');
      const feedback = document.getElementById('entry-feedback');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const code = input.value.trim();

        if (!code) {
          input.setAttribute('aria-invalid', 'true');
          feedback.textContent = '请先输入邀请码。';
          feedback.className = 'feedback error';
          input.focus();
          return;
        }

        feedback.textContent = '正在验证邀请码…';
        feedback.className = 'feedback';

        try {
          const res = await fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
          });
          const data = await res.json();

          if (!data.ok) {
            input.setAttribute('aria-invalid', 'true');
            feedback.textContent = data.message || '邀请码不正确，请核对后重试。';
            feedback.className = 'feedback error';
            input.focus();
            return;
          }

          // 验证通过：写入访问令牌（关闭浏览器标签页后失效，需重新输入邀请码）
          sessionStorage.setItem('nav_token', data.token);
          input.setAttribute('aria-invalid', 'false');
          feedback.textContent = '正在进入导航…';
          feedback.className = 'feedback success';
          window.location.assign('./安装导航-卡点选择页原型.html');
        } catch (err) {
          input.setAttribute('aria-invalid', 'true');
          feedback.textContent = '网络异常，请稍后重试。';
          feedback.className = 'feedback error';
        }
      });

      input.addEventListener('input', () => {
        if (input.value.trim()) {
          input.setAttribute('aria-invalid', 'false');
          if (feedback.classList.contains('error')) {
            feedback.textContent = '邀请码已输入。';
            feedback.className = 'feedback';
          }
        }
      });
    </script>
  </body>
</html>
