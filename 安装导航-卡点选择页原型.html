<html lang="zh-CN">

    <title>Codex 安装导航｜选择卡点</title>
    <link rel="stylesheet" href="./安装导航-共享样式.css" />

  <body>
    <main class="shell">
      <header class="topbar" aria-label="页面标题">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Codex 零基础答疑营</span></div>
        <span class="page-count">第 1 步 / 选卡点</span>
      </header>

      <section class="page" aria-labelledby="page-title">
        <p class="eyebrow">现在最卡在哪？</p>
        <h1 id="page-title">先选一个最接近你的情况。</h1>
        <p class="lead">不用一次处理所有问题。选完后，只看当前这一关需要的操作和录屏。</p>

        <div class="selection" aria-label="卡点选择">
          <a class="option-card" href="./安装导航-前置条件.html">
            <small>01 / 前置条件</small><strong>前置条件还没准备好</strong><span class="detail">还没有魔法，或已经有但不会安装、不会打开“使用魔法的客户端”。</span>
          </a>
          <a class="option-card" href="./安装导航-下载.html">
            <small>02 / 下载与安装</small><strong>不知道去哪里下载 Codex</strong><span class="detail">从官方入口下载，再按 Mac 或 Windows 完成安装。</span>
          </a>
          <a class="option-card" href="./安装导航-登录.html">
            <small>03 / 登录</small><strong>打开 Codex，但卡在登录</strong><span class="detail">没有自己的账号，或验证流程无法继续。</span>
          </a>
        </div>
        <a class="back-link" href="./安装导航-进入页原型.html">← 返回填写邀请码</a>
      </section>
    </main>
